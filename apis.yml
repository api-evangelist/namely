aid: namely
name: Namely
description: >-
  Namely is a mid-market Human Capital Management (HCM) platform combining HR, payroll,
  onboarding, benefits administration, time and attendance, performance management and applicant
  tracking, delivered as a multi-tenant SaaS on customer subdomains. It publishes a public
  developer portal on Stoplight carrying a Swagger 2.0 contract for its REST API v1 (39 paths, 54
  operations, 95 schemas) covering employee profiles, the tenant-specific profile field schema,
  groups and teams, job titles and tiers, company resources, the social home feed, notifications
  and reports. Alongside the REST API, Namely runs a SCIM 2.0 provisioning surface acting as the
  source of record for identity providers such as Okta, and supports SAML 2.0 single sign-on as a
  service provider. Authentication is either a 3-legged OAuth 2.0 authorization code grant for
  partner integrations or a Personal Access Token for a customer's own integrations, both minted
  inside the customer's own tenant. Namely merged into the combined Vensure Employer Solutions /
  PrismHR organisation in September 2022.
