apis:
  - name: Namely API
    description: >-
      REST API v1 for a Namely HRIS tenant. Covers employee profiles (including the tenant's own
      custom fields), the profile field and section schema, groups, group types and teams, job
      titles and job tiers, company resource folders and documents, the social home feed with
      events, comments and likes, notifications, saved reports and Namely system reference data
      for countries and subdivisions. Authenticated with an OAuth 2.0 access token or a Personal
      Access Token in the Authorization header. The base URL is tenant-templated - every customer
      calls their own Namely subdomain, and there is no shared API host.
    humanURL: https://developers.namely.com/docs/namely-api/12dab89109ded-namely-api
    baseURL: https://{company}.namely.com/api/v1
