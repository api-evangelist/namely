graph_notes:
  - >-
    Profile is the single hub. Fifteen of the twenty-two entities either reference it or are
    referenced by it.
  - >-
    The model separates profile CONTENT (Profile) from profile SCHEMA (Field, Section) - an
    unusually explicit split, and the reason POST /profiles/fields is a high-consequence write:
    it changes the shape of every employee record in the tenant and has no delete operation.
  - >-
    Group and Team overlap. Group carries an `is_team` boolean AND there is a separate /teams
    surface with its own Team Link shape, so the same real-world object can be reached two ways.
  - >-
    Reference data (Country, Subdivision) is universal across all Namely tenants and immutable,
    which makes GET /countries the safest read in the API.
