spec: openapi/namely-api-openapi.json
name: Namely API error catalog
description: >-
  This catalog is short because Namely's contract is silent about failure. The published Swagger
  2.0 document declares 46 200s, 7 201s and one `default` across 54 operations and NOT A SINGLE
  4xx or 5xx response - so nothing here could be derived from the spec. Every entry below was read
  from the provider's prose documentation instead, and each names the exact article that states
  it. There is no error-code registry, no problem-type vocabulary and no documented error
  envelope.
format: none
format_note: >-
  Not RFC 9457. No application/problem+json media type appears in the contract, and Namely
  publishes no error-response schema. An integrator cannot know the shape of a Namely error
  without provoking one.
derivation:
  spec_4xx_responses: 0
  spec_5xx_responses: 0
  spec_default_responses: 1
  spec_default_location: POST /likes/event_comment/{comment-id}
  note: >-
    The single `default` response carries no schema. This is the whole of the contract's failure
    surface.
problem_types:
  - id: rate-limited-profiles
    status: 406
    title: Not Acceptable (rate limit exceeded)
    detail: >-
      Requests to GET /profiles beyond 100 per minute are rejected with HTTP 406. Namely uses 406
      Not Acceptable where the conventional signal is 429 Too Many Requests, which means a generic
      client's retry logic will not recognise it as throttling.
    remediation: >-
      Throttle to 100 requests per minute against GET /profiles and paginate rather than
      requesting large pages. No Retry-After header is documented, so back off on a fixed schedule.
    method: searched
    source: https://developers.namely.com/docs/getting-started/introduction.md
  - id: pat-owner-inactive
    status: 403
    title: Forbidden (token owner deactivated)
    detail: >-
      If the Namely profile that created a Personal Access Token becomes inactive or is deleted,
      every request authenticated with that token returns HTTP 403 and the integration stops
      working. A PAT carries the permissions of its creator, so this failure is a people event,
      not a code event.
    remediation: >-
      Create integration PATs under a dedicated administrator "Integrations User" profile that
      persists through staff turnover, as Namely's own documentation recommends.
    method: searched
    source: https://developers.namely.com/docs/getting-started/authentication.md
  - id: unauthenticated
    status: 401
    title: Unauthorized
    detail: >-
      API requests without valid authentication are refused. Namely states this as a rule but does
      not publish the status code or body it returns, so the code here is the HTTP convention and
      not a documented value.
    remediation: Send a valid OAuth 2.0 access token or Personal Access Token in the Authorization header.
    method: derived
    confidence: low
    source: https://developers.namely.com/docs/getting-started/authentication.md
    note: Status code inferred from convention; Namely does not state it. Flagged low confidence deliberately.
  - id: plaintext-http
    status: null
    title: Request over plain HTTP refused
    detail: >-
      "All API requests must be made over HTTPS while calls made over plain HTTP will be refused."
      Namely does not publish whether this is a redirect, a 400 or a connection reset.
    remediation: Use HTTPS for every request.
    method: searched
    source: https://developers.namely.com/docs/getting-started/authentication.md
  - id: access-token-expired
    status: null
    title: OAuth access token expired
    detail: >-
      OAuth 2.0 access tokens expire after 15 minutes. Namely documents the lifetime and the
      refresh flow but not the error returned on an expired token.
    remediation: >-
      Exchange the stored refresh token at https://{company}.namely.com/api/v1/oauth2/token with
      grant_type=refresh_token, and persist the refresh token returned on every refresh.
    method: searched
    source: https://developers.namely.com/docs/getting-started/authentication.md
gaps:
  - No published error-code registry or error-type vocabulary.
  - No documented error response body shape; the contract declares no error schema.
  - >-
    No 4xx/5xx responses in the OpenAPI, so generated clients and mock servers model only the
    happy path. This is the single largest contract-quality gap in this profile.
  - >-
    A non-standard throttle status (406 rather than 429) with no Retry-After header means an agent
    must be told about it out of band to handle it correctly.
