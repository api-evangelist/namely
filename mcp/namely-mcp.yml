agent_readiness_blockers:
  - >-
    No idempotency mechanism. A retried create tool duplicates the record, and there is no delete
    for profiles, fields, job titles or job tiers to clean up after it.
  - >-
    No 4xx/5xx responses in the contract, so a tool wrapper has no typed failures to surface and
    an agent cannot distinguish a permission error from a validation error without guessing.
  - >-
    Throttling returns 406 rather than 429 with no Retry-After, so standard agent retry logic will
    misclassify it as a content-negotiation failure.
  - >-
    No dry-run. High-consequence schema writes (POST /profiles/fields) cannot be rehearsed.
  - >-
    No shared API host. Every deployment is tenant-scoped to {company}.namely.com, so a hosted MCP
    server would have to be per-tenant or take the subdomain as configuration.
